name: Gymapp CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies & Black
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black

      - name: Format check with Black
        run: black --check .

  docker-build-and-test:
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t gym_app:latest .

      - name: Run tests inside container with xvfb
        run: |
          docker run --rm \
            -e PYTHONUNBUFFERED=1 \
            gym_app:latest \
            xvfb-run -a python -u -m pytest -v -s aceestver_test_1.py