name: Gymapp app Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black

      - name: Format code
        run: |
          pip install black
          black --check .

  docker-build-and-test:
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
       - name: Checkout code
         uses: actions/checkout@v4

       - name: Build Docker image
         run: docker build -t aceest-app:latest .

       - name: Install xvfb on runner
         run: sudo apt-get update && sudo apt-get install -y xvfb

       - name: Run tests inside container with xvfb
         run: xvfb-run -a docker run --rm aceest-app:latest .venv/bin/pytest aceestver_test_1.py
